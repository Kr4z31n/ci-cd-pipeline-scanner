[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supplytrace"
version = "0.2.0"
description = "Software supply chain attack traceability, CI/CD weakness detection and attack-path analysis"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "networkx>=3.1",
]

[project.optional-dependencies]
# The LLM correlation step is optional by design: every command works, and the
# whole test suite passes, without this installed.
llm = ["google-genai>=1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
supplytrace = "supplytrace.cli:main"
cicd-detector = "supplytrace.cicd.cli:main"

[tool.setuptools.packages.find]
include = ["supplytrace*", "cicd_detector*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]
